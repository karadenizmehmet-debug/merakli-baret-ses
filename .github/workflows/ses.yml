name: Seslendir

on:
  push:
    paths:
      - "istekler/**/script.json"
  workflow_dispatch:
    inputs:
      istek:
        description: "istekler/ altındaki klasör adı (ör. elmas)"
        required: true

permissions:
  contents: write

concurrency:
  group: seslendir
  cancel-in-progress: false

jobs:
  ses:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Hangi istekler?
        id: liste
        run: |
          if [ -n "${{ github.event.inputs.istek }}" ]; then
            echo "dizinler=istekler/${{ github.event.inputs.istek }}" >> "$GITHUB_OUTPUT"
          else
            d=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep '^istekler/.*/script.json$' | xargs -r -n1 dirname | sort -u | tr '\n' ' ')
            [ -z "$d" ] && d=$(ls -d istekler/*/ | sed 's#/$##' | tr '\n' ' ')
            echo "dizinler=$d" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Model önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-mtl-v2

      - name: Kurulum
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Seslendir
        run: |
          for d in ${{ steps.liste.outputs.dizinler }}; do
            echo "::group::$d"
            python seslendir.py "$d"
            echo "::endgroup::"
          done

      - name: Repoya yaz
        run: |
          git config user.name "seslendir-bot"
          git config user.email "seslendir-bot@users.noreply.github.com"
          git add istekler
          git diff --cached --quiet && exit 0
          git commit -m "ses: ${{ steps.liste.outputs.dizinler }}"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
